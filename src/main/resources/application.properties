spring.application.name=alertas

# Configuracion Swagger UI
server.forward-headers-strategy=framework

# Configuracion BD MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/alertas}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# Configuracion Apache Kafka
spring.kafka.bootstrap-servers=${KAFKA_SERVERS:localhost:9092}

# Configuracion para serializar los DTOs como JSON
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.hatim.alertas.dto
spring.kafka.consumer.auto-offset-reset=earliest

# Configuracion de Tomcat para evitar desconexiones y conexiones zombies
server.tomcat.keep-alive-timeout=60000
server.tomcat.connection-timeout=20000
server.tomcat.threads.max=200
server.tomcat.accept-count=100

# Simulador de precios: activo por defecto (demo)
app.simulador.enabled=${APP_SIMULADOR_ENABLED:true}

# Exponer unicamente el endpoint de salud via Actuator
management.endpoints.web.exposure.include=health