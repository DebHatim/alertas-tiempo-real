services:
  mysql:
    image: mysql:8.0
    container_name: alertas-mysql
    environment:
      MYSQL_DATABASE: alertas
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      # Usuario de aplicacion con privilegios solo sobre la BD "alertas".
      # La imagen oficial de MySQL lo crea automaticamente al arrancar.
      MYSQL_USER: ${DB_APP_USER}
      MYSQL_PASSWORD: ${DB_APP_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - alertas-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: alertas-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - alertas-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: alertas-kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://${SERVER_IP:-localhost}:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - alertas-network

  backend:
    build: .
    container_name: alertas-backend
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 45s
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      - DB_URL=jdbc:mysql://mysql:3306/alertas?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
      - DB_USERNAME=${DB_APP_USER}
      - DB_PASSWORD=${DB_APP_PASSWORD}
      - KAFKA_SERVERS=kafka:29092
      - APP_CORS_ALLOWED_ORIGIN=${APP_CORS_ALLOWED_ORIGIN}
      - APP_JWT_SECRET=${APP_JWT_SECRET}
      - APP_SIMULADOR_ENABLED=${APP_SIMULADOR_ENABLED:-true}
    networks:
      - alertas-network

  frontend:
    build:
      context: ./frontend-alertas
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: alertas-frontend
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - alertas-network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: alertas-phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_ARBITRARY: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - alertas-network

volumes:
  mysql_data:

networks:
  alertas-network:
    driver: bridge